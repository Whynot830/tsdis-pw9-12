# Значения для экономии ресурсов Minikube и приёма ServiceMonitor из namespace `finances`
# без обязательного label release (см. prometheus.prometheusSpec ниже).
#
# Установка (пример):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f practice4/monitoring/kube-prometheus-stack-values-minikube.yaml

prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

defaultRules:
  create: true

grafana:
  enabled: true
  adminPassword: admin-change-me
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Принимать любые ServiceMonitor / PodMonitor во всех namespace (удобно для учебного проекта).
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 512Mi

alertmanager:
  enabled: false
