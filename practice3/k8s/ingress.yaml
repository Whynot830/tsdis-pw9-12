apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: finances
spec:
  ingressClassName: nginx
  rules:
    # localtest.me → 127.0.0.1 по DNS: не нужен /etc/hosts; на macOS не конфликтует с mDNS (.local).
    - host: finance.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
    - host: finance.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
