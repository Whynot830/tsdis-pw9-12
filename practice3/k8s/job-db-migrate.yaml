apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: finances
  labels:
    app: db-migrate
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U finances -d finances; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: finances-secrets
                  key: postgres-password
      containers:
        - name: migrate
          image: finance-db-migrate:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finances-secrets
                  key: database-url
            - name: CI
              value: 'true'
          command: ['npx', 'drizzle-kit', 'push', '--force']
