# Скопируйте в secret.yaml и при необходимости замените значения.
# В репозитории коммитится только этот пример; secret.yaml в .gitignore.
#
#   cp practice3/k8s/secret.example.yaml practice3/k8s/secret.yaml
#   kubectl apply -f practice3/k8s/secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: finances-secrets
  namespace: finances
type: Opaque
stringData:
  postgres-password: 'finances'
  # Должен совпадать с пользователем/паролем/БД в Postgres Deployment и с postgres-password.
  database-url: 'postgresql://finances:finances@postgres:5432/finances'
  better-auth-secret: 'dev-better-auth-secret-min-32-chars-long!!'
  internal-api-token: 'dev-internal-token-change-me'
  telegram-bot-token: ''
  google-client-id: ''
  google-client-secret: ''
  github-client-id: ''
  github-client-secret: ''
